<!DOCTYPE html>
<html>
<head>
    <title>Local Business Contact Form</title>
</head>
<body>
    <h2>Local Business Contact Form</h2>
    
    <form id="leadForm">
        <label>Name:</label><br>
        <input type="text" id="name" value="Sarah BusinessOwner"><br><br>
        
        <label>Email:</label><br>
        <input type="text" id="email" value="sarah@localshop.com"><br><br>
        
        <label>Message:</label><br>
        <input type="text" id="message" value="Hey, I need more customers!"><br><br>
        
        <button type="button" onclick="submitForm()">Submit Lead</button>
    </form>

    <script>
        async function submitForm() {
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('https://objetivo.app.n8n.cloud/webhook/bebe1fd9-4666-4215-8ecc-57d1d0bddf8e', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    alert('Lead sent successfully!');
                } else {
                    alert('Error sending lead.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to connect to webhook.');
            }
        }
    </script>
</body>
</html>
